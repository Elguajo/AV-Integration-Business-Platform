name: av-prototype

x-app: &app
  image: av-platform-prototype:0.1.0
  build:
    context: ..
    dockerfile: prototype/Dockerfile
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:11.8.3@sha256:ae6119716edac6998ae85508431b3d2e666530ddf4e94c61a10710caec9b0f71
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run prototype/manage.ps1 prepare first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-character-set-client-handshake", "--innodb-snapshot-isolation=OFF"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 24
  redis-cache:
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
  redis-queue:
    image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
  init:
    <<: *app
    entrypoint: ["/home/frappe/frappe-bench/env/bin/python", "/opt/av-prototype/site.py"]
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run prototype/manage.ps1 prepare first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run prototype/manage.ps1 prepare first}
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
  backend:
    <<: *app
    depends_on:
      init:
        condition: service_completed_successfully
  websocket:
    <<: *app
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      init:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: ["bench", "worker", "--queue", "short,default,long"]
    depends_on:
      init:
        condition: service_completed_successfully
  scheduler:
    <<: *app
    command: ["bench", "schedule"]
    depends_on:
      init:
        condition: service_completed_successfully
  frontend:
    <<: *app
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: av.localhost
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 10m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started

volumes:
  sites:
  logs:
  db-data:
